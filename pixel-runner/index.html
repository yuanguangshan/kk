<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>PIXEL RUNNER · 像素跳跃</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; background:#0a0a12; overflow:hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color:#8b93b8; -webkit-user-select:none; user-select:none; touch-action:none;
  }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:8px; }
  #stage { position:relative; line-height:0; }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    display:block; background:#000;
    box-shadow: 0 0 0 2px #1d2340, 0 0 32px rgba(90,120,255,.18), 0 18px 50px rgba(0,0,0,.6);
  }
  #hint { font-size:12px; letter-spacing:.5px; text-align:center; line-height:1.7; max-width:96vw; }
  #hint b { color:#c9d2ff; font-weight:600; }
  #pad { position:fixed; inset:auto 0 0 0; display:none; justify-content:space-between; padding:18px 22px calc(18px + env(safe-area-inset-bottom)); }
  #pad.on { display:flex; }
  #pad button {
    width:72px; height:72px; border-radius:50%; border:2px solid #39406b; background:rgba(24,29,52,.72);
    color:#c9d2ff; font-size:26px; font-family:inherit; backdrop-filter:blur(4px);
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  #pad button:active { background:rgba(70,84,150,.85); transform:scale(.94); }
  #pad .grp { display:flex; gap:12px; align-items:center; }
  #pad button.wide { width:88px; font-size:18px; letter-spacing:1px; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="320" height="180"></canvas></div>
<div id="hint"></div>
<div id="pad">
  <div class="grp"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="grp"><button data-k="start" class="wide">开始</button><button data-k="jump">跳</button></div>
  <!-- 疾跑按钮：只在第 24 关出现，按住时跑步速度是普通跑的 4 倍 -->
  <div class="grp" id="sprintBtn" style="display:none"><button data-k="run" class="wide">⚡ 疾跑 ×4</button></div>
</div>
<script>
'use strict';
/* ============================================================
   PIXEL RUNNER — 320x180 内部分辨率，整数倍放大，像素素材全部代码生成
   ============================================================ */
const W = 320, H = 180, T = 16, STEP = 1 / 60;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

const DSH_KEYS = ['left', 'right', 'up', 'down', 'jump', 'run', 'start', 'pause', 'mute', 'crt'];

/* ---------------- 输入 ---------------- */
const keys = Object.create(null);
const MAP = {
  ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'jump', ArrowDown: 'down',
  KeyA: 'left', KeyD: 'right', KeyW: 'jump', KeyS: 'down',
  Space: 'jump', ShiftLeft: 'run', ShiftRight: 'run',
  Enter: 'start', KeyP: 'pause', Escape: 'pause', KeyM: 'mute', KeyC: 'crt', KeyS: 'selectKey',
  KeyK: 'spin', KeyJ: 'spin',
};
addEventListener('keydown', e => {
  const k = MAP[e.code];
  if (!k) return;
  e.preventDefault();
  if (keys[k]) return;
  keys[k] = true;
  onPress(k);
});
addEventListener('keyup', e => { const k = MAP[e.code]; if (k) { e.preventDefault(); keys[k] = false; } });
addEventListener('blur', () => { for (const k of DSH_KEYS) keys[k] = false; });
addEventListener('pointerdown', () => SFX.unlock());

/* 触屏支持：手机 / 平板 */
const IS_TOUCH = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;
const needsStart = () => GAME.state === 'title' || GAME.state === 'over' || GAME.state === 'win' || GAME.state === 'clear';
if (IS_TOUCH) {
  const pad = document.getElementById('pad');
  pad.classList.add('on');
  document.getElementById('hint').innerHTML =
    '<b>◀ ▶</b> 移动 &nbsp;·&nbsp; <b>跳</b> 跳跃（长按跳更高）<br>' +
    '<b>开始</b> 开始 / 暂停 &nbsp;·&nbsp; 点击画面也可以开始';
  for (const b of pad.querySelectorAll('button')) {
    const k = b.dataset.k;
    const down = e => {
      e.preventDefault();
      if (k === 'start') { onPress('start'); return; }   // 开始键在游玩中就是暂停键
      keys[k] = true;
      onPress(k);
    };
    const up = e => { e.preventDefault(); keys[k] = false; };
    b.addEventListener('touchstart', down, { passive: false });
    b.addEventListener('touchend', up, { passive: false });
    b.addEventListener('touchcancel', up, { passive: false });
  }
  // 标题 / 失败 / 过关界面：点画面任意处也能开始；选关界面支持点格子
  document.getElementById('stage').addEventListener('pointerdown', ev => {
    // 标题界面点下半部分 = 打开选关（手机没有 S 键）
    if (GAME.state === 'title') {
      const r0 = cv.getBoundingClientRect();
      const py0 = (ev.clientY - r0.top) / r0.height * H;
      if (py0 > H * 0.75) { openSelect(); return; }
    }
    if (GAME.state === 'select') {
      // 把点击坐标换算到内部 320x180 分辨率，命中哪个格子就进哪关
      const r = cv.getBoundingClientRect();
      const px = (ev.clientX - r.left) / r.width * W, py = (ev.clientY - r.top) / r.height * H;
      const cols = 6, cw = 34, ch = 22, x0 = (W - cols * cw) / 2 + 4, y0 = 50;
      const col = Math.round((px - x0) / cw), row = Math.round((py - y0) / ch);
      const i = row * cols + col;
      if (i >= 0 && i < LEVELS.length && Math.abs(px - (x0 + col * cw)) <= 14 && Math.abs(py - (y0 + row * ch)) <= 10) {
        selectIdx = i;
        if (i < SAVE.unlocked) startAt(i);
      }
      return;
    }
    if (needsStart()) onPress('start');
  });
} else {
  document.getElementById('hint').innerHTML =
    '<b>← →</b> 移动 &nbsp;·&nbsp; <b>空格 / ↑</b> 跳跃（长按跳更高） &nbsp;·&nbsp; <b>Shift</b> 疾跑<br>' +
    '<b>Enter</b> 开始 / 继续 &nbsp;·&nbsp; <b>P</b> 暂停 &nbsp;·&nbsp; <b>M</b> 静音 &nbsp;·&nbsp; <b>C</b> 扫描线';
}

/* ---------------- 音频（方波 chiptune） ---------------- */
const SFX = {
  ac: null, master: null, muted: false,
  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = this.muted ? 0 : 0.5;
    this.master.connect(this.ac.destination);
    MUSIC.start();
  },
  tone(freq, dur, type, vol, to, delay) {
    if (!this.ac || this.muted) return;
    const t0 = this.ac.currentTime + (delay || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol) {
    if (!this.ac || this.muted) return;
    const n = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const g = this.ac.createGain(); g.gain.value = vol;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start();
  },
  jump() { this.tone(340, .16, 'square', .10, 620); },
  coin() { this.tone(988, .06, 'square', .10); this.tone(1319, .14, 'square', .09, undefined, .06); },
  stomp() { this.tone(220, .09, 'square', .12, 90); this.noise(.10, .18); },
  bump() { this.tone(150, .07, 'square', .10, 90); },
  break_() { this.noise(.22, .22); this.tone(180, .12, 'triangle', .08, 60); },
  die() { this.tone(500, .5, 'sawtooth', .10, 70); this.tone(250, .5, 'square', .06, 50, .05); },
  goal() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .16, 'square', .11, undefined, i * .09)); },
  cp() { [659, 880, 1174].forEach((f, i) => this.tone(f, .12, 'square', .10, undefined, i * .07)); },
  over() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, .30, 'triangle', .11, undefined, i * .16)); },
  win() { [523, 659, 784, 1046, 784, 1046, 1319].forEach((f, i) => this.tone(f, .18, 'square', .10, undefined, i * .11)); },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.5; },
};

/* 8-bit 小循环：4 小节 × 16 分音符 */
const MUSIC = {
  on: true, timer: null, step: 0, next: 0, spb: 60 / 132 / 4,
  lead: [
    0, null, 3, 5, 7, null, 5, 3, 0, null, -2, 0, 3, null, null, null,
    5, null, 7, 10, 12, null, 10, 7, 5, null, 3, 5, 7, null, null, null,
    0, null, 3, 5, 7, null, 10, 12, 10, null, 7, 5, 3, null, null, null,
    5, null, 3, 0, 0, null, 7, 10, 12, null, 10, 7, 5, 3, 0, null,
  ],
  bass: [
    0, null, null, 0, null, null, 7, null, 0, null, null, 0, null, 7, null, null,
    0, null, null, 0, null, null, 7, null, 0, null, null, 0, null, 7, null, null,
    -4, null, null, -4, null, null, 3, null, -4, null, null, -4, null, 3, null, null,
    -2, null, null, -2, null, null, 5, null, -2, null, null, -2, null, 5, null, null,
  ],
  start() {
    if (this.timer || !SFX.ac) return;
    this.next = SFX.ac.currentTime + 0.1;
    this.timer = setInterval(() => this.tick(), 25);
  },
  tick() {
    if (!SFX.ac || !this.on) return;
    while (this.next < SFX.ac.currentTime + 0.15) {
      const s = this.step % 64;
      const l = this.lead[s];
      if (l !== null && l !== undefined) {
        SFX.tone(440 * Math.pow(2, l / 12), 0.14, 'square', 0.045, undefined, this.next - SFX.ac.currentTime);
      }
      const b = this.bass[s];
      if (b !== null && b !== undefined) {
        SFX.tone(110 * Math.pow(2, b / 12), 0.16, 'triangle', 0.075, undefined, this.next - SFX.ac.currentTime);
      }
      this.next += this.spb;
      this.step++;
    }
  },
};

/* ---------------- 3x5 像素字体 ---------------- */
const GLYPH = {
  A: '111/101/111/101/101', B: '110/101/110/101/110', C: '111/100/100/100/111', D: '110/101/101/101/110',
  E: '111/100/111/100/111', F: '111/100/111/100/100', G: '111/100/101/101/111', H: '101/101/111/101/101',
  I: '111/010/010/010/111', J: '001/001/001/101/111', K: '101/101/110/101/101', L: '100/100/100/100/111',
  M: '101/111/111/101/101', N: '110/101/101/101/101', O: '111/101/101/101/111', P: '111/101/111/100/100',
  Q: '111/101/101/111/001', R: '111/101/110/101/101', S: '111/100/111/001/111', T: '111/010/010/010/010',
  U: '101/101/101/101/111', V: '101/101/101/101/010', W: '101/101/111/111/101', X: '101/101/010/101/101',
  Y: '101/101/010/010/010', Z: '111/001/010/100/111',
  0: '111/101/101/101/111', 1: '010/110/010/010/111', 2: '111/001/111/100/111', 3: '111/001/111/001/111',
  4: '101/101/111/001/001', 5: '111/100/111/001/111', 6: '111/100/111/101/111', 7: '111/001/001/010/010',
  8: '111/101/111/101/111', 9: '111/101/111/001/111',
  ' ': '000/000/000/000/000', '-': '000/000/111/000/000', '.': '000/000/000/000/010', ':': '000/010/000/010/000',
  '!': '010/010/010/000/010', '?': '111/001/011/000/010', '/': '001/001/010/100/100', '+': '000/010/111/010/000',
  '*': '000/101/010/101/000', ',': '000/000/000/000/010', "'": '010/010/000/000/000', '<': '001/010/100/010/001',
  '>': '100/010/001/010/100', '(': '001/010/010/010/001', ')': '100/010/010/010/100',
};
function textWidth(s, sc) { return s.length * 4 * sc - sc; }
function drawText(s, x, y, color, sc, shadow) {
  sc = sc || 1;
  s = String(s).toUpperCase();
  if (shadow) {
    let cx = x;
    for (let i = 0; i < s.length; i++) {
      const g = GLYPH[s[i]] || GLYPH[' '];
      for (let r = 0; r < 5; r++) {
        const row = g.split('/')[r];
        for (let c = 0; c < 3; c++) if (row[c] === '1') ctx.fillRect(cx + c * sc, y + 1 * sc + r * sc, sc, sc);
      }
      cx += 4 * sc;
    }
  }
  let cx = x;
  for (let i = 0; i < s.length; i++) {
    const g = GLYPH[s[i]] || GLYPH[' '];
    ctx.fillStyle = color;
    for (let r = 0; r < 5; r++) {
      const row = g.split('/')[r];
      for (let c = 0; c < 3; c++) if (row[c] === '1') ctx.fillRect(cx + c * sc, y + r * sc, sc, sc);
    }
    cx += 4 * sc;
  }
}
const centerText = (s, y, color, sc, shadow) => drawText(s, Math.round((W - textWidth(String(s), sc)) / 2), y, color, sc, shadow);

/* ---------------- 角色精灵（字符画 + 调色板） ---------------- */
function sprite(rows, w, h) {
  return rows.map(r => { const a = r.split(''); while (a.length < w) a.push('.'); return a.slice(0, w); });
}
const HERO_PAL = {
  H: '#3a2b52', S: '#f7c99b', E: '#2b2038', T: '#e8484f', T2: '#b9313c', P: '#3c4d8f', B: '#5a3a22', A: '#f7c99b',
};
const HERO = {
  idle: sprite([
    '...HHHHHH....', '..HHHHHHHH...', '..HHSSSSSH...', '..HSSSSSSSE..',
    '..HSSSSSSSSE.', '...SSSSSSSS..', '...SSSSSSSS..', '....TTTTTT...',
    '...TTTTTTTA..', '...TTTTTTTA..', '...PPPPPP....', '...PP..PP....',
    '...PP..PP....', '...PP..PP....', '...BB..BB....', '...BB..BB....',
  ], 12, 16),
  run1: sprite([
    '...HHHHHH....', '..HHHHHHHH...', '..HHSSSSSH...', '..HSSSSSSSE..',
    '..HSSSSSSSSE.', '...SSSSSSSS..', '..ASSSSSSS...', '..ATTTTTTA..',
    '...TTTTTTA...', '...TTTTTT....', '..PPPPPPP....', '..PP..PPP....',
    '..PP..PP.....', '.PP...PP.....', '.BB...BB.....', '.BB..........',
  ], 12, 16),
  run2: sprite([
    '...HHHHHH....', '..HHHHHHHH...', '..HHSSSSSH...', '..HSSSSSSSE..',
    '..HSSSSSSSSE.', '...SSSSSSSS..', '...SSSSSSSA..', '..ATTTTTTT...',
    '..ATTTTTTT...', '...TTTTTT....', '...PPPPPP....', '...PPPPPP....',
    '...PP....PP..', '...PP....PP..', '...BB....BB..', '.............',
  ], 12, 16),
  jump: sprite([
    '...HHHHHH....', '..HHHHHHHH...', '..HHSSSSSH...', '..HSSSSSSSE..',
    '..HSSSSSSSSE.', '.ASSSSSSSS...', '.ATTTTTTTA...', '..TTTTTTT....',
    '..TTTTTTT....', '...TTTTT.....', '..PPPPPP.....', '..PP.PP......',
    '..PP..PP.....', '..BB..PP.....', '.......BB....', '..............',
  ], 12, 16),
  fall: sprite([
    '...HHHHHH....', '..HHHHHHHH...', '..HHSSSSSH...', '..HSSSSSSSE..',
    '..HSSSSSSSSE.', '.ASSSSSSS....', '.ATTTTTTA....', '..TTTTTTT....',
    '..TTTTTTT....', '...TTTTT.....', '...PPPPP.....', '...PP.PP.....',
    '..PP..PP.....', '..BB..BB.....', '.............', '.............',
  ], 12, 16),
};
const BLOB = sprite([
  '...BBBBBB...', '.BBBBBBBBBB.', '.BBBBBBBBBB.', 'BBWWBBBBWWBB',
  'BBWWBBBBWWBB', 'BBBWWWWWWBBB', 'BBBBBBBBBBBB', '.BBBBBBBBBB.',
  '..BBBBBBBB..', '..KKK..KKK..', '..KKK..KKK..', '............',
], 12, 12);
/** 蘑菇怪：14×16 的高个蘑菇（够高才踩得上去，10px 的矮怪一跳就飞过去了）。 */
const SHROOM = sprite([
  '....BBBBBB....', '..BBBBBBBBBB..', '.BBBBBBBBBBBB.', 'BBWWBBBBBBWWBB',
  'BWWWWBBBBWWWWB', 'BWWWWBBBBWWWWB', 'BBWWBBBBBBWWBB', 'BBBBBBBBBBBBBB',
  '.BBBBBBBBBBBB.', '..BBBBBBBBBB..', '...SSSSSSSS...', '...SSSSSSSS...',
  '...SSKKKKSS...', '...SSKKKKSS...', '...SSSSSSSS...', '...SSSSSSSS...',
], 14, 16);
const FLY = sprite([
  '...BBBB.....', 'BBBBBBBB...', 'BBWWBBBBBB..', 'BBWWBBBBBB..',
  'BBBBBBBBBB..', '.BBBBBBBB...', '..WWWWW.....', '.WW.WWW.....',
  '............', '............', '............', '............',
], 12, 12);
function drawSprite(rows, pal, x, y, flip, scale) {
  const s = scale || 1;
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) {
      const ch = row[c];
      if (ch === '.') continue;
      ctx.fillStyle = pal[ch] || pal[ch.toUpperCase()] || '#fff';
      const px = flip ? x + (row.length - 1 - c) * s : x + c * s;
      ctx.fillRect(px, y + r * s, s, s);
    }
  }
}

/* ---------------- 关卡主题与瓦片图集 ---------------- */
const THEMES = {
  meadow: {
    sky: ['#5cc2ef', '#c6f0ff'], sun: '#fff6bd', sunGlow: 'rgba(255,246,189,.16)',
    hillFar: '#84c9a4', hillNear: '#3f9e68',
    block: ['#8a5a2b', '#b3763a', '#573417', '#331f10'],
    accent: '#7ed957', plat: ['#d79a5b', '#8a5a2b'], deco: '#2f8f4f', stars: false,
  },
  dusk: {
    sky: ['#ff9b62', '#6b3b8f'], sun: '#ffe9a8', sunGlow: 'rgba(255,214,140,.18)',
    hillFar: '#a56d9c', hillNear: '#573472',
    block: ['#6b4a7a', '#916cb0', '#3f2650', '#251434'],
    accent: '#ffcf5c', plat: ['#a97fc0', '#5c3a6e'], deco: '#6d3f8f', stars: false,
  },
  night: {
    sky: ['#080c26', '#27306b'], sun: '#eef2ff', sunGlow: 'rgba(200,220,255,.14)',
    hillFar: '#1c2450', hillNear: '#111838',
    block: ['#38477f', '#5568ad', '#212a58', '#121736'],
    accent: '#6fe3ff', plat: ['#5f79c4', '#2a3468'], deco: '#26356b', stars: true,
  },
};

const AT_IDX = { ground0: 0, plat: 4, brick: 5, q: 6, used: 7, spike: 8, bush: 9, flower: 10, pole: 11, flag: 12, crate: 13 };
const ATLAS_N = 14;
const atlasCache = Object.create(null);
function getAtlas(theme) {
  if (atlasCache[theme]) return atlasCache[theme];
  const P = THEMES[theme];
  const c = document.createElement('canvas');
  c.width = ATLAS_N * T; c.height = T;
  const g = c.getContext('2d');
  const rect = (i, x, y, w, h, col) => { g.fillStyle = col; g.fillRect(i * T + x, y, w, h); };

  for (let v = 0; v < 4; v++) {
    const i = AT_IDX.ground0 + v;
    rect(i, 0, 0, T, T, P.block[1]);
    rect(i, 0, 0, T, 3, P.accent);
    rect(i, 0, 0, T, 1, lighten(P.accent, .28));
    rect(i, 0, T - 3, T, 3, P.block[2]);
    rect(i, 0, T - 1, T, 1, P.block[3]);
    rect(i, T - 1, 0, 1, T, P.block[3]);
    for (let k = 0; k < 3 + v; k++) {
      const hx = (k * 5 + v * 3 + 2) % 13 + 1, hy = 6 + ((k * 7 + v) % 6);
      rect(i, hx, hy, 2, 2, P.block[2]);
    }
  }
  rect(AT_IDX.plat, 0, 0, T, 2, lighten(P.plat[0], .2));
  rect(AT_IDX.plat, 0, 2, T, 3, P.plat[0]);
  rect(AT_IDX.plat, 0, 5, T, 1, P.block[3]);

  rect(AT_IDX.brick, 0, 0, T, T, P.block[0]);
  for (let r = 0; r < 4; r++) {
    rect(AT_IDX.brick, 0, r * 4 + 3, T, 1, P.block[3]);
    const off = (r % 2) * 4;
    for (let k = 0; k < 2; k++) rect(AT_IDX.brick, off + k * 8 + 7, r * 4, 1, 4, P.block[3]);
  }
  rect(AT_IDX.brick, 0, 0, T, 1, lighten(P.block[0], .2));

  for (const [idx, base, dot] of [[AT_IDX.q, P.block[1], P.accent], [AT_IDX.used, P.block[2], P.block[0]]]) {

const SOLID = new Set(['#', 'B', '?', 'u', 'X']);
const tileAt = (l, tx, ty) => (ty < 0 || ty >= l.h || tx < 0 || tx >= l.w) ? '.' : l.grid[ty][tx];

function buildLevel(def) {
  const grid = [];
  for (let y = 0; y < def.h; y++) grid.push(new Array(def.w).fill('.'));
  const set = (x, y, ch) => { if (x >= 0 && x < def.w && y >= 0 && y < def.h) grid[y][x] = ch; };
  const rect = (x, y, w, h, ch) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) set(x + i, y + j, ch); };
  for (const [a, b] of def.segs) rect(a, def.groundY, b - a + 1, def.h - def.groundY, '#');

  const lv = { voids: [], spikeMovers: [], buried: [], mines: [], boom: [], def, grid, w: def.w, h: def.h, theme: def.theme, name: def.name, enemies: [], movers: [], coins: [], bump: [], flag: null, cp: null, spawn: { x: T, y: T * 10 } };
  for (const op of def.ops) {
    const [k] = op;
    if (k === 'p') rect(op[1], op[2], op[3], 1, '=');
    else if (k === 'q') set(op[1], op[2], '?');
    else if (k === 'b') set(op[1], op[2], 'B');
    else if (k === 'c') for (let i = 0; i < op[3]; i++) lv.coins.push({ x: op[1] + i, y: op[2], taken: false, ph: hash2(op[1] + i, op[2]) * 6.28 });
    else if (k === 'e') {
      const seg = def.segs.find(s => op[1] >= s[0] && op[1] <= s[1]) || [0, def.w - 1];
      lv.enemies.push({ type: 0, x: op[1] * T + 1, y: (op[2] + 1) * T - 30, w: 14, h: 30, vx: -0.34, vy: 0, dead: 0, dir: -1, baseY: op[2] * T, ph: hash2(op[1], op[2]) * 6.28,
        hp: 2, hitFlash: 0,   // 蘑菇怪要踩两下：第一下踩成受伤（闪白+被击退），第二下才死
        sx: op[1] * T + 1, sy: (op[2] + 1) * T - 30,
        // 段首 3 格留作落点缓冲区：跨坑落地不会被迎面走来的怪直接撞死
        // 走满整段平台；落地安全由玩家的「落地保护帧」保证
        // 左右各留缓冲：左边不撞跨坑落点的人，右边不贴着坑边走（踩完被弹进坑）
        x0: seg[0] * T + 2, x1: (seg[1] - 1) * T });
    }
    else if (k === 'f') lv.enemies.push({ type: 1, x: op[1] * T + 2, y: op[2] * T, w: 12, h: 8, vx: -0.45, vy: 0, dead: 0, dir: -1, baseY: op[2] * T, x0: op[1] * T - 40, x1: op[1] * T + 56, ph: hash2(op[1], op[2]) * 6.28,
      sx: op[1] * T + 2, sy: op[2] * T });
    // 天空偷袭怪：挂在天上，玩家走到下面才俯冲下来（op[3]=触发列）
    else if (k === 'fall') lv.enemies.push({ type: 2, x: op[1] * T + 1, y: op[2] * T, w: 14, h: 16, vx: 0, vy: 0, dead: 0, dir: -1, baseY: op[2] * T, ph: hash2(op[1], op[2]) * 6.28,
      hp: 1, hitFlash: 0, faller: true, trigger: op[3] * T, armed: true,
      sx: op[1] * T + 1, sy: op[2] * T });
    // 来回横扫的尖刺陷阱：在 op[3]~op[4] 列之间左右移动（op[2] 是所在行）
    else if (k === 'spm') lv.spikeMovers.push({ x: op[1] * T, y: op[2] * T, w: op[5] || 16, h: 8, x0: op[3] * T, x1: op[4] * T, vx: 0.55, dx: 0 });
    // 空中的巡逻怪：站在高空长桥上，只在指定的两列之间来回走（op[3]/op[4] 是桥的左右列）
    else if (k === 'se') {
      const lo = op[3] * T + 2, hi = (op[4] + 1) * T - 16;
      lv.enemies.push({ type: 0, x: op[1] * T + 1, y: (op[2] + 1) * T - 30, w: 14, h: 30, vx: -0.34, vy: 0, dead: 0, dir: -1, baseY: op[2] * T, ph: hash2(op[1], op[2]) * 6.28,
        hp: 2, hitFlash: 0, sky: true, restY: (op[2] + 1) * T - 30,
        sx: op[1] * T + 1, sy: (op[2] + 1) * T - 30,
        x0: lo, x1: Math.max(lo + 8, hi) });
    }
    else if (k === 'sp') rect(op[1], op[2], op[3], 1, '^');
    else if (k === 'm') lv.movers.push({ x: op[1] * T, y: op[2] * T, w: 48, h: 6, x0: op[1] * T, x1: (op[1] + op[3]) * T, dir: 1, dx: 0 });
    else if (k === 'd') set(op[1], op[2], 'd');
    // 斜坡：'sl' op，op[3] > 0 → '/'（左低右高，可跑上去）；op[3] < 0 → '\'（左高右低，下坡跳）
    else if (k === 'sl') set(op[1], op[2], op[3] > 0 ? '/' : '\\');
    // 高山坡阶梯：逐格垒的实体砖（一格比一格高，往右跳着爬上去）
    else if (k === 'h') set(op[1], op[2], '#');
    // 地刺埋伏：平时藏在地下（看不见），玩家走到触发范围才「唰」地弹出来，过一会儿缩回去
    else if (k === 'spikeup') lv.buried.push({ tx: op[1], ty: op[2], x: op[1] * T, y: op[2] * T, phase: 'idle', timer: 0, up: 0 });
    // 埋伏地雷：埋在地下看不见（只有一点点凸起），踩上去就炸
    else if (k === 'mine') lv.mines.push({ x: op[1] * T + 2, y: (op[2] + 2) * T - 6, w: 12, h: 6, armed: true, blink: 0, buried: true, vx: 0, x0: 0, x1: 0 });
    // 移动地雷：看得见，在 op[3]~op[4] 列之间来回走，碰到就炸
    else if (k === 'walkmine') lv.mines.push({ x: op[1] * T + 2, y: (op[2] + 2) * T - 8, w: 14, h: 8, armed: true, blink: 0, buried: false, vx: 0.42, x0: op[3] * T, x1: (op[4] + 1) * T - 14 });
    // 虚空段：整段地面挖空，掉下去就是死（旋转跳关卡）
    // 下坡中间的坑：只挖地面（不是整段虚空）
    else if (k === 'dpit') { for (let x = op[1]; x <= op[2]; x++) { set(x, lv.def.groundY, '.'); set(x, lv.def.groundY + 1, '.'); } }
    else if (k === 'void') { for (let x = op[1]; x <= op[2]; x++) for (let y = 0; y < lv.h; y++) set(x, y, '.'); lv.voids.push([op[1], op[2]]); }
    else if (k === 'start') { lv.spawn = { x: op[1] * T, y: op[2] * T }; }
    else if (k === 'cp') { lv.cp = { x: op[1] * T, y: op[2] * T, active: false }; }
    else if (k === 'goal') { set(op[1], op[2], 'G'); lv.flag = { x: op[1] * T, y: op[2] * T }; }
  }
  return lv;
}

function makeClouds(seed) {

    const r2 = hash2(seed + 99, i * 31 + 2);
    out.push({ x: r * (W + 140) - 70, y: 12 + r2 * 60, s: 0.7 + r2 * 0.9, sp: 0.05 + r * 0.07 });
  }
  return out;
}
function makeStars(seed) {
  const out = [];
  for (let i = 0; i < 70; i++) {
    const r = hash2(seed + 7, i * 17 + 3), r2 = hash2(seed + 13, i * 23 + 11);
    out.push({ x: r * 400, y: r2 * 110, tw: r2 * 6.28 });

function loadLevel(i) {
  GAME.levelIndex = i;
  { const sb = document.getElementById('sprintBtn'); if (sb) sb.style.display = (i === 23) ? '' : 'none'; }

}
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
/** 斜坡坡面高度：给定格坐标与格内 x 偏移，返回该 x 处坡面顶部的 y。
    '/' 左低右高（上坡向右），'\\' 左高右低（下坡向右）。 */
function slopeTopY(ch, tx, ty, px) {
  const local = clamp((px - tx * T) / T, 0, 1);
  const base = (ty + 1) * T;                       // 格底
  return ch === '/' ? base - local * T : base - (1 - local) * T;
}
const camTarget = () => (GAME.level.h * T > H ? clamp(player.y - H * 0.6, 0, GAME.level.h * T - H) : 0);

/* ---------------- 粒子 ---------------- */
function burst(x, y, color, n, spread, up, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = spread * (0.4 + Math.random() * 0.9);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - up,
      life: life || 26, max: life || 26, color, g: 0.12, size: Math.random() < .5 ? 1 : 2,
    });
  }
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .99;
    if (--p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x | 0, p.y | 0, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

/* ---------------- 物理 ---------------- */
const GRAV = 0.22, GRAV_HOLD = 0.155, JUMP_V = -4.85, MAX_FALL = 6.4, JUMP_CUT = 0.6;
const RUN = 1.65, SPRINT = 2.1, ACC = 0.16, AIR_ACC = 0.10, FRIC = 0.18;

function moveX(l, p) {
  p.x += p.vx;
  // 斜坡：踩到坡面时把玩家抬到坡面高度（不被横向碰撞挡住），可以一路跑上坡顶
  const under = Math.floor((p.y + p.h - 1) / T);   // 坡面所在格（脚底往上一像素）
  const mid = Math.floor((p.x + p.w / 2) / T);
  const su = tileAt(l, mid, under);
  if ((su === '/' || su === '\\') && p.vy >= 0 && p.onGround) {
    p.y = slopeTopY(su, mid, under, p.x + p.w / 2) - p.h;
    return;
  }
  const y0 = Math.floor(p.y / T), y1 = Math.floor((p.y + p.h - 1) / T);
  const x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + p.w) / T);
  for (let ty = y0; ty <= y1; ty++) {
    if (SOLID.has(tileAt(l, x0, ty))) {
      if (p.vx > 0) p.x = x0 * T - p.w; else if (p.vx < 0) p.x = (x0 + 1) * T;
      p.vx = 0;
    }
    if (x1 !== x0 && SOLID.has(tileAt(l, x1, ty))) {
      if (p.vx > 0) p.x = x1 * T - p.w; else if (p.vx < 0) p.x = (x1 + 1) * T;
      p.vx = 0;
    }
  }
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  const maxX = l.w * T - p.w;
  if (p.x > maxX) { p.x = maxX; p.vx = 0; }
}

function moveY(l, p) {
  const prevBottom = p.y + p.h;
  p.y += p.vy;
  const wasGround = p.onGround;
  p.onGround = false;
  const x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + p.w - 1) / T);
  if (p.vy < 0) {
    const y0 = Math.floor(p.y / T);
    for (let tx = x0; tx <= x1; tx++) {
      const ch = tileAt(l, tx, y0);
      if (SOLID.has(ch)) {
        p.y = (y0 + 1) * T; p.vy = 0;
        bumpTile(l, tx, y0, ch);
        break;
      }
    }
  } else {
    const y1 = Math.floor((p.y + p.h) / T);
    for (let tx = x0; tx <= x1; tx++) {
      const ch = tileAt(l, tx, y1);
      const solid = SOLID.has(ch);
      const oneWay = ch === '=';
      if (ch === '/' || ch === '\\') {
        // 落在斜坡上：脚底贴着坡面，而不是整格顶面
        const topY = slopeTopY(ch, tx, y1, p.x + p.w / 2);
        if (p.y + p.h >= topY) {
          p.y = topY - p.h; p.vy = 0; p.onGround = true; p.landedThisFrame = (p.airFrames || 0) >= 5;
          break;
        }
      } else if (solid || (oneWay && prevBottom <= y1 * T + 1)) {
        p.y = y1 * T - p.h; p.vy = 0; p.onGround = true; p.landedThisFrame = (p.airFrames || 0) >= 5;
        break;
      }
    }
    // 边缘缓冲：下落高速时 box 会滑过段末 1px 才触地，按上一帧横坐标补扫一次，避免擦边落空掉坑
    if (!p.onGround && p.vy > 0.5 && prevBottom <= y1 * T) {
      const back = p.x - Math.min(p.vx, 6);
      for (let tx = Math.floor(back / T); tx <= Math.floor((back + p.w - 1) / T); tx++) {
        if (SOLID.has(tileAt(l, tx, y1))) {
          p.y = y1 * T - p.h; p.vy = 0; p.onGround = true; p.landedThisFrame = (p.airFrames || 0) >= 5;
          break;
        }
      }
    }
    for (const m of l.movers) {
      if (p.x + p.w > m.x + 2 && p.x < m.x + m.w - 2 && prevBottom <= m.y + 4 && p.y + p.h >= m.y) {
        p.y = m.y - p.h; p.vy = 0; p.onGround = true; p.riding = m; p.landedThisFrame = (p.airFrames || 0) >= 5;
        break;
      }
    }
  }
  if (p.onGround) { p.coyote = 6; } else if (!wasGround) { /* 保持 coyote */ }
}

function bumpTile(l, tx, ty, ch) {
  if (ch === '?') {
    l.grid[ty][tx] = 'u';
    SFX.coin();
    GAME.coins++; GAME.totalCoins++;
    burst(tx * T + 8, ty * T + 2, '#ffd85e', 8, 1.4, 1.6, 30);
  } else if (ch === 'B') {
    l.grid[ty][tx] = '.';
    SFX.break_();
    const P = THEMES[l.theme];
    burst(tx * T + 8, ty * T + 8, P.block[1], 10, 1.8, 1.2, 34);
  } else if (ch === 'u') {
    SFX.bump();
  }
}

function updatePlayer(l) {
  const wantSprint = keys.run;
  // 第 24 关专属：按住疾跑时速度是普通跑的 4 倍（普通疾跑只有 2.1）
  const isL24 = GAME.levelIndex === 23;
  const maxSpd = wantSprint ? (isL24 ? RUN * 4 : SPRINT) : RUN;
  const accel = player.onGround ? ACC : AIR_ACC;
  if (keys.left) { player.vx -= accel; player.facing = -1; }
  if (keys.right) { player.vx += accel; player.facing = 1; }
  if (!keys.left && !keys.right) {
    const f = player.onGround ? FRIC : 0.04;
    if (player.vx > f) player.vx -= f; else if (player.vx < -f) player.vx += f; else player.vx = 0;
  }
  player.vx = clamp(player.vx, -maxSpd, maxSpd);
  if (Math.abs(player.vx) > maxSpd) player.vx = Math.sign(player.vx) * maxSpd;

  if (keys.jump && !player.jumpHeld) player.buffer = 7;
  player.jumpHeld = keys.jump;
  if (player.buffer > 0 && player.coyote > 0) {
    player.vy = JUMP_V;
    player.coyote = 0; player.buffer = 0; player.onGround = false;
    SFX.jump();
    burst(player.x + 5, player.y + player.h, '#ffffff', 4, .8, .4, 16);
  }
  if (!keys.jump && player.vy < 0) player.vy *= JUMP_CUT;
  // 旋转跳：空中按 K/J 触发一次；旋转期间下落更慢、横向略快，能跨过普通跳够不到的虚空。
  // 落地才复位，所以每次跳跃只能用一次。
  // airFrames 要到本帧末尾才更新，用 > 2 会错过按键那一帧（下一帧 spinHeld 已置位）→ 旋转永远触发不了
  if (keys.spin && !player.spinHeld && player.spin <= 0 && !player.onGround && player.airFrames >= 1) {
    player.spin = 46;
    player.spinUsed = true;
    // 旋转跳的核心：起旋时给一次明确的上升冲量（空中再蹬一下），
    // 之后一段时间重力大幅减小 → 滞空明显更久、飞得更远，才能跨过普通跳够不到的深坑。
    // 注意必须「赋值」而不是 Math.min：上升中 vy 已经是 -4.8，取 min 等于没有加成。
    player.vy = -4.3;
    SFX.jump();
    burst(player.x + 5, player.y + 7, '#8fe3ff', 8, 1.4, .6, 22);
  }
  player.spinHeld = keys.spin;
  if (player.spin > 0) {
    player.spin--;
    if (Math.abs(player.vx) > 0.1) player.vx += Math.sign(player.vx) * 0.045;   // 旋转中横向推进更快
  }
  if (player.onGround) { player.spin = 0; player.spinUsed = false; }
  player.buffer--; player.coyote--;
  if (player.coyote < 0) player.coyote = 0;
  if (player.buffer < 0) player.buffer = 0;

  // 旋转中重力极小：滞空明显拉长，才能跨过普通跳够不到的深坑（旋转自己接管重力，避免重复叠加）
  const gNow = player.spin > 0 ? 0.075 : ((player.vy < 0 && keys.jump) ? GRAV_HOLD : GRAV);
  player.vy += gNow;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;

  if (player.riding) { player.x += player.riding.dx; }
  player.riding = null;

  // 记录本帧移动前的脚底位置：踩头判定要用它判断"是否从上方落下"
  player.prevBottom = player.y + player.h;
  player.landedThisFrame = false;

  moveX(l, player);
  moveY(l, player);

  if (player.onGround && Math.abs(player.vx) > 0.4 && Math.random() < 0.25) {
    burst(player.x + 5, player.y + player.h - 1, 'rgba(255,255,255,.55)', 1, .5, .3, 12);
  }
  if (player.onGround && player.landedThisFrame) player.landGrace = 20;   // 落地保护：刚落地 0.33 秒内接触怪算踩
  else if (player.landGrace > 0) player.landGrace--;
  player.airFrames = player.onGround ? 0 : (player.airFrames || 0) + 1;
  if (player.inv > 0) player.inv--;
  player.anim += Math.abs(player.vx);
}

function updateEnemies(l) {
  for (const e of l.enemies) {
    if (e.dead) { if (++e.dead > 20) e.dead = -1; continue; }
    if (e.hitFlash > 0) e.hitFlash--;
    if (e.hitCd > 0) e.hitCd--;
    if (e.stun > 0) { e.stun--; continue; }        // 眩晕中：不动也不碰人
    if (e.faller) {
      // 天空偷袭怪三段状态：挂着(armed) → 蓄力抖动(windup，预警) → 俯冲 → 落地后可被踩死
      if (e.armed) {
        if (player.x + player.w > e.trigger) { e.armed = false; e.windup = 22; SFX.bump(); }
      } else if (e.windup > 0) {
        e.windup--;
        if (e.windup === 0) e.vy = 1.2;                      // 蓄力结束，开始下落
      } else {
        e.vy = Math.min(e.vy + GRAV * 1.5, MAX_FALL);
        e.y += e.vy;
        const gy = Math.floor((e.y + e.h) / T);
        const gx = Math.floor((e.x + e.w / 2) / T);
        const below = tileAt(l, gx, gy);
        if (SOLID.has(below) || below === '=') { e.y = gy * T - e.h; e.vy = 0; e.landed = true; }
        if (e.y > l.h * T + 20) e.dead = 1;
      }
      continue;
    }
    if (e.type === 0) {
      if (e.sky) {
        // 空中的巡逻怪：钉在高空桥上左右走，不掉下去
        e.x += e.vx;
        if (e.x < e.x0) { e.x = e.x0; e.vx = Math.abs(e.vx); }
        if (e.x > e.x1) { e.x = e.x1; e.vx = -Math.abs(e.vx); }
        e.y = e.restY;                        // 脚底始终踩在桥面上，不会掉下去
      } else {
      e.vy = Math.min(e.vy + GRAV, MAX_FALL);
      e.x += e.vx;
      const ahead = Math.floor((e.x + (e.vx > 0 ? e.w + 1 : -1)) / T);
      const below = tileAt(l, ahead, Math.floor((e.y + e.h + 2) / T));
      const wall = SOLID.has(tileAt(l, ahead, Math.floor((e.y + e.h - 2) / T)));
      if (wall || !SOLID.has(below)) { e.vx = -e.vx; e.x += e.vx * 2; }
      if (e.x0 !== undefined) {                 // 在出生点附近巡逻，不走到坑边被踩飞
        if (e.x < e.x0) { e.x = e.x0; e.vx = Math.abs(e.vx); }
        if (e.x > e.x1) { e.x = e.x1; e.vx = -Math.abs(e.vx); }
      }
      e.y += e.vy;
      if (SOLID.has(tileAt(l, Math.floor((e.x + 6) / T), Math.floor((e.y + e.h) / T)))) {
        e.y = Math.floor((e.y + e.h) / T) * T - e.h; e.vy = 0;
      }
      }
    } else {
      e.x += e.vx;
      if (e.x < e.x0) { e.x = e.x0; e.vx = Math.abs(e.vx); }
      if (e.x > e.x1) { e.x = e.x1; e.vx = -Math.abs(e.vx); }
      e.dir = e.vx > 0 ? 1 : -1;
      e.y = e.baseY + Math.sin(clock * 2.4 + e.ph) * 14;
    }
  }
}

function updateMovers(l) {
  for (const m of l.movers) {
    const old = m.x;
    m.x += 0.55 * m.dir;
    if (m.x >= m.x1) { m.x = m.x1; m.dir = -1; }
    if (m.x <= m.x0) { m.x = m.x0; m.dir = 1; }
    m.dx = m.x - old;
  }
  // 横扫尖刺：在两端之间来回平移，撞到就死
  for (const sm of l.spikeMovers || []) {
    sm.x += sm.vx;
    if (sm.x >= sm.x1) { sm.x = sm.x1; sm.vx = -Math.abs(sm.vx); }
    if (sm.x <= sm.x0) { sm.x = sm.x0; sm.vx = Math.abs(sm.vx); }
  }
  // 地雷：移动地雷来回巡逻；到段边掉头；闪烁是给玩家的预警
  for (const mn of l.mines || []) {
    if (!mn.armed) continue;
    mn.blink = (mn.blink + 1) % 60;
    if (mn.vx) {
      mn.x += mn.vx;
      if (mn.x >= mn.x1) { mn.x = mn.x1; mn.vx = -Math.abs(mn.vx); }
      if (mn.x <= mn.x0) { mn.x = mn.x0; mn.vx = Math.abs(mn.vx); }
      mn.y = Math.floor(mn.y / 8) * 8;                 // 贴地不飘
    }
  }
  // 爆炸特效
  for (let i = (l.boom || []).length - 1; i >= 0; i--) { if (++l.boom[i].t > 26) l.boom.splice(i, 1); }
  // 地刺埋伏：平时缩在地下（up:0），玩家进入触发范围就弹出来（up:1），冒头一段时间后缩回
  for (const bp of l.buried || []) {
    // 触发范围放宽到 2.5 格，并且先「预警抖动」18 帧再弹出——否则弹出只要 5 帧，人根本反应不过来
    const near = Math.abs((player.x + player.w / 2) - (bp.x + 8)) < 40;
    if (bp.phase === 'idle') {
      bp.timer++;
      if (near && bp.timer > 6) { bp.phase = 'warn'; bp.timer = 0; SFX.bump(); }
    } else if (bp.phase === 'warn') {
      if (++bp.timer > 18) { bp.phase = 'up'; bp.timer = 0; }   // 预警 0.3 秒，够玩家判断
    } else if (bp.phase === 'up') {
      bp.up = Math.min(1, bp.up + 0.22);            // 快速弹出
      if (++bp.timer > 70) { bp.phase = 'down'; bp.timer = 0; }
    } else {                                         // down：缩回去，然后冷却
      bp.up = Math.max(0, bp.up - 0.12);
      if (bp.up <= 0 && ++bp.timer > 55) { bp.phase = 'idle'; bp.timer = 0; }
    }
  }
}

function overlaps(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function checkWorld(l) {
  const pb = { x: player.x, y: player.y, w: player.w, h: player.h };
  for (const c of l.coins) {
    if (c.taken) continue;
    if (overlaps(pb, { x: c.x * T + 3, y: c.y * T + 3, w: 10, h: 10 })) {
      c.taken = true; GAME.coins++; GAME.totalCoins++;
      SFX.coin();
      burst(c.x * T + 8, c.y * T + 8, '#ffd85e', 5, 1.2, .8, 22);
    }
  }
  if (l.cp && !l.cp.active && overlaps(pb, { x: l.cp.x + 3, y: l.cp.y - 4, w: 10, h: 20 })) {
    // 碰到复活点：之后死亡从这里重生，金币进度保留
    l.cp.active = true;
    SFX.cp();
    burst(l.cp.x + 8, l.cp.y - 4, '#7ed957', 14, 1.8, 2.2, 44);
    GAME.banner = { text: 'CHECKPOINT!', t: 110 };
  }
  if (l.flag) {
    // 碰到旗杆或越过旗杆都算过关，避免跳跃时从旗杆上方飞过去
    const f = { x: l.flag.x, y: l.flag.y - 44, w: 16, h: 58 };
    if (player.x > l.flag.x || overlaps(pb, f)) {
      // 第 4 关：boss 没倒下之前到不了终点
      if (GAME.levelIndex === 3 && !BOSS.win) { GAME.banner = { text: '先打败 BOSS！', t: 90 }; player.x = Math.min(player.x, l.flag.x - 24); return; }
      levelClear(); return;
    }
  }
  const x0 = Math.floor(player.x / T), x1 = Math.floor((player.x + player.w - 1) / T);
  const y0 = Math.floor(player.y / T), y1 = Math.floor((player.y + player.h - 1) / T);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (tileAt(l, tx, ty) === '^') { die('spike'); return; }
    }
  }
  if (player.y > l.h * T + 16) { die('pit'); return; }
  // 地雷：踩上去或碰到就炸（判定比画面略小，留一点擦身余地）
  for (const mn of l.mines || []) {
    if (!mn.armed) continue;
    if (player.x + player.w > mn.x + 2 && player.x < mn.x + mn.w - 2 &&
        player.y + player.h > mn.y + 1 && player.y < mn.y + mn.h + 2) { die('mine'); return; }
  }
  // 地刺埋伏：只有冒头到一定高度才扎人（缩在地下时可以安全跑过）
  for (const bp of l.buried || []) {
    if (bp.up < 0.45) continue;
    const h = bp.up * 14;
    if (player.x + player.w > bp.x + 1 && player.x < bp.x + 15 &&
        player.y + player.h > bp.y + T - h && player.y < bp.y + T) { die('spike'); return; }
  }
  // 横扫尖刺：碰到就死（判定略窄，给玩家一点擦身而过的余地）
  for (const sm of l.spikeMovers || []) {
    if (player.x + player.w > sm.x + 2 && player.x < sm.x + sm.w - 2 &&
        player.y + player.h > sm.y && player.y < sm.y + sm.h) { die('spike'); return; }
  }
  for (const e of l.enemies) {
    if (e.dead) continue;
    const eb = { x: e.x, y: e.y, w: e.w, h: e.h };
    // 踩踏判定框：怪的头顶上方放宽 16px。
    // 注意入口必须用这个放宽框——玩家脚底落在怪头顶上方时（脚底高于怪顶）与身体框不相交，
    // 若用 eb 做入口会在踩中之前就 continue 掉，永远踩不到。
    const stompHit = { x: e.x - 4, y: e.y - 16, w: e.w + 8, h: e.h + 16 };
    if (!overlaps(pb, stompHit)) continue;
    // 脚底只要落在怪的「头部区域」（顶部 10px 内）就算踩——上升/下落都算；
    // 脚底低于头部则必须真的撞到身体才算受伤，平地侧撞照旧有威胁。
    const headHit = (e.hitCd || 0) <= 0 &&
      (player.prevBottom <= e.y + Math.min(e.h, 10) || player.landGrace > 0);
    // 眩晕中的怪不伤人（可以安全落地补刀），但补刀仍必须真的踩到头，
    // 否则第一下之后人还贴在怪身上就会立刻结算成第二下，等于一下踩死
    if (!headHit && e.stun > 0) continue;
    const stomp = headHit;
    if (!stomp && !overlaps(pb, eb)) continue;     // 只是从头顶擦过又没踩中：不判定
    if (stomp) {
      // 蘑菇怪要踩两下：第一下受伤（闪白、被击退、玩家弹起可以再跳一次），第二下才死
      if (e.type === 0 && e.hp > 1) {
        e.hp--;
        e.hitFlash = 45;
        e.stun = 45;                            // 踩晕：短暂不动也不伤人，方便补第二下
        player.landGrace = 0;                   // 用掉落地保护
        e.hitCd = 18;                           // 冷却：必须弹开再回来踩，避免贴着连算两下
        e.vx = -Math.sign(e.vx || 1) * 0.34;     // 被踩后转身退开，给玩家第二次机会
        player.vy = keys.jump ? -5.0 : -4.0;     // 弹得比击杀时高一点，方便连踩第二下
        SFX.bump();
        burst(e.x + 6, e.y + 4, '#ffe27a', 8, 1.5, .8, 22);
      } else {
        e.dead = 1;
        player.vy = keys.jump ? -4.2 : -3.3;
        SFX.stomp();
        burst(e.x + 6, e.y + 4, '#ffffff', 7, 1.6, .6, 24);
      }
    } else if (e.type === 1) {
      // 踩鸟跳：从上方踩到飞行鸟 → 鸟被踩掉，玩家被高高弹起（远高于踩蘑菇怪），
      // 可以借它在空中二段跳、够到高台或飞过更宽的坑。从下方/侧面撞到仍只是被顶开（不致死）。
      const fromAbove = player.prevBottom <= e.y + e.h + 4 && player.vy > -0.5;
      e.dead = 1;
      if (fromAbove) {
        player.vy = -6.6;                       // 普通满跳只有 -4.85，这是明确的「二段跳」
        player.spin = 0;                        // 重置旋转：踩鸟之后还能再转一次
        player.spinUsed = false;
        SFX.stomp();
        burst(e.x + 6, e.y + 4, '#8fe3ff', 12, 2.0, 1.0, 30);
        GAME.banner = { text: 'BIRD BOOST!', t: 45 };
      } else {
        player.vy = Math.min(player.vy, -2.2);
        SFX.bump();
        burst(e.x + 6, e.y + 4, '#c9b3ff', 9, 1.5, .8, 26);
      }
    } else if (player.inv <= 0) { die('enemy'); return; }
  }
}

function die(why) {
  GAME.deaths++;
  GAME.deathWhy = why;
  GAME.state = 'dead';
  GAME.timer = 0;
  SFX.die();
  burst(player.x + 5, player.y + 7, '#ff6b6b', 14, 2, 2.4, 46);
}

function levelClear() {
  GAME.state = 'clear';
  recordClear(GAME.levelIndex, GAME.time, GAME.coins);
  GAME.timer = 0;
  SFX.goal();
  const f = GAME.level.flag;
  burst(f.x + 6, f.y + 2, '#ffe27a', 20, 2.4, 3, 60);
}

function respawn() {
  GAME.lives--;
  if (GAME.lives <= 0) {
    // 命用光不再踢回第 1 关：补满命数、就地回到本关复活点，关卡进度保留
    GAME.lives = GAME.level.def.life || 3;
    GAME.banner = { text: '复活 · 继续挑战', t: 110 };
    SFX.cp();
  }
  const l = GAME.level;
  const atCp = !!(l.cp && l.cp.active);
  const back = atCp ? l.cp : l.spawn;
  player.x = back.x; player.y = back.y;
  player.vx = 0; player.vy = 0; player.inv = 70; player.riding = null;
  for (const e of l.enemies) { e.dead = 0; e.x = e.sx; e.y = e.sy; e.vx = e.type ? -0.45 : -0.34; e.dir = -1; e.hp = e.type === 0 ? 2 : e.hp; e.hitFlash = 0; e.stun = 0; e.hitCd = 0; }
  if (!atCp) {                     // 从头重生才清金币；复活点重生保留进度
    for (const c of l.coins) c.taken = false;
    GAME.coins = 0;
  }
  cam.y = camTarget();
  cam.x = clamp(player.x - W / 2 + player.w / 2, 0, l.w * T - W);
  GAME.state = 'play';
}

/* ---------------- 存档（localStorage：解锁进度 + 每关最佳） ---------------- */
const SAVE_KEY = 'pixelrunner.save.v1';
const SAVE = { unlocked: 1, best: {}, coins: 0, last: 1 };
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    SAVE.unlocked = clamp(Number(s.unlocked) || 1, 1, LEVELS.length);
    SAVE.last = clamp(Number(s.last) || 1, 1, SAVE.unlocked);
    SAVE.coins = Number(s.coins) || 0;
    SAVE.best = (s.best && typeof s.best === 'object') ? s.best : {};
  } catch (e) { /* 存档损坏或浏览器禁用 localStorage：按新档开始，不阻断游戏 */ }
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }
  catch (e) { /* 隐私模式等禁写：忽略，本局照常可玩 */ }
}
function recordClear(i, timeFrames, coins) {
  SAVE.unlocked = Math.max(SAVE.unlocked, Math.min(i + 2, LEVELS.length));
  SAVE.last = Math.min(i + 2, LEVELS.length);
  SAVE.coins += coins;
  const prev = SAVE.best[i];
  const sec = +(timeFrames / 60).toFixed(1);
  if (!prev || sec < prev.time) SAVE.best[i] = { time: sec, coins };
  writeSave();
}
function resetSave() {
  SAVE.unlocked = 1; SAVE.last = 1; SAVE.coins = 0; SAVE.best = {};
  writeSave();
}

function onPress(k) {
  SFX.unlock();
  if (k === 'mute') { SFX.setMuted(!SFX.muted); MUSIC.on = !SFX.muted; return; }
  if (k === 'crt') { GAME.crt = !GAME.crt; return; }
  if (k === 'pause' && (GAME.state === 'play')) { GAME.paused = !GAME.paused; return; }
  if (GAME.state === 'select') { selectPress(k); return; }
  if (k === 'start' && GAME.state === 'title') { startAt(SAVE.last - 1); return; }
  if (GAME.state === 'play') { if (k === 'start') GAME.paused = !GAME.paused; return; }
  if (k === 'selectKey' && (GAME.state === 'title' || GAME.state === 'win' || GAME.state === 'over')) { openSelect(); return; }
  if (k !== 'start') return;
  if (GAME.state === 'over' || GAME.state === 'win') { openSelect(); }
  else if (GAME.state === 'clear' && GAME.timer > 30) { nextLevel(); }
}
function startAt(i) {
  BOSS.active = false; BOSS.win = false; BOSS.t = 0; BOSS.skillT = 0; BOSS.hazards.length = 0;
  GAME.levelIndex = clamp(i, 0, LEVELS.length - 1);
  GAME.totalCoins = 0; GAME.totalTime = 0; GAME.deaths = 0;
  loadLevel(GAME.levelIndex);
  GAME.state = 'play';
  SAVE.last = GAME.levelIndex + 1; writeSave();
}
function openSelect() { GAME.state = 'select'; selectIdx = SAVE.last - 1; }
let selectIdx = 0;
function selectPress(k) {
  const cols = 6, n = LEVELS.length;
  if (k === 'left') selectIdx = Math.max(0, selectIdx - 1);
  else if (k === 'right') selectIdx = Math.min(n - 1, selectIdx + 1);
  else if (k === 'up') selectIdx = Math.max(0, selectIdx - cols);
  else if (k === 'down') selectIdx = Math.min(n - 1, selectIdx + cols);
  else if (k === 'pause') { GAME.state = 'title'; }
  else if (k === 'start' && selectIdx < SAVE.unlocked) { SFX.coin(); startAt(selectIdx); }
}

function nextLevel() {
  GAME.totalTime += GAME.time;
  if (GAME.levelIndex + 1 < LEVELS.length) {
    loadLevel(GAME.levelIndex + 1);
    GAME.state = 'play';
    SAVE.last = GAME.levelIndex + 1; writeSave();
  } else {
    GAME.state = 'win'; GAME.timer = 0; SFX.win();
  }
}

/* ---------------- 第 4 关 BOSS ----------------
   跑到 3/4 处触发：boss 每 5 秒放一次技能（蘑菇下压 / 生成魔怪 / 紫色蘑菇下压 / 地雷），
   每个技能只存在 5 秒。撑满 100 秒就算赢，终点才开放。 */
const BOSS = { active: false, t: 0, skillT: 0, next: 0, hazards: [], win: false };
const BOSS_SURVIVE = 100 * 60;                       // 100 秒

function bossStart() {
  BOSS.active = true; BOSS.t = 0; BOSS.skillT = 0; BOSS.win = false;
  BOSS.hazards.length = 0;
  GAME.banner = { text: 'BOSS! 存活 100 秒', t: 150 };
  SFX.win();
}
function bossSkill(l) {
  const px = player.x, wpx = l.w * T;
  const kind = ['slam', 'spawn', 'purple', 'mine'][rnd0(4)];
  if (kind === 'slam') {
    // 蘑菇下压：随机 3 个位置，从上方砸下来
    for (let i = 0; i < 3; i++) {
      const hx = clamp(px + (rnd0(200) - 40), 0, wpx - 16);
      BOSS.hazards.push({ kind: 'shroom', x: hx, y: 2 * T, vy: 0, t: 0, w: 14, h: 16 });
    }
  } else if (kind === 'spawn') {
    // 生成几个魔怪
    for (let i = 0; i < 2 + rnd0(2); i++) {
      const ex = clamp(px + 60 + rnd0(120), 0, wpx - 16);
      l.enemies.push({ type: 0, x: ex, y: (GYR(l) - 1) * T, w: 14, h: 16, vx: -0.34, vy: 0, dead: 0, dir: -1, baseY: (GYR(l) - 1) * T, ph: 0,
        hp: 2, hitFlash: 0, restY: 0, sx: ex, sy: (GYR(l) - 1) * T, x0: ex - 32, x1: ex + 32 });
    }
  } else if (kind === 'purple') {
    // 紫色蘑菇下压
    for (let i = 0; i < 2; i++) {
      const hx = clamp(px + (rnd0(160) - 30), 0, wpx - 14);
      BOSS.hazards.push({ kind: 'purple', x: hx, y: 2 * T, vy: 0, t: 0, w: 14, h: 14 });
    }
  } else {
    // 地雷
    for (let i = 0; i < 2; i++) {
      const hx = clamp(px + rnd0(150), 0, wpx - 12);
      BOSS.hazards.push({ kind: 'mine', x: hx, y: (GYR(l) - 1) * T, vy: 0, t: 0, w: 12, h: 8 });
    }
  }
}
function GYR(l) { return l.def.groundY; }
function rnd0(n) { return Math.floor(Math.random() * n); }
function clamp2(v, a, b) { return v < a ? a : (v > b ? b : v); }

function updateBoss(l) {
  if (!BOSS.active) return;
  BOSS.t++;
  BOSS.skillT++;
  if (BOSS.skillT >= 5 * 60) { BOSS.skillT = 0; bossSkill(l); SFX.bump(); }
  // 技能推进 + 5 秒后消失
  for (let i = BOSS.hazards.length - 1; i >= 0; i--) {
    const h = BOSS.hazards[i];
    h.t++;
    if (h.kind === 'shroom' || h.kind === 'purple') {
      h.vy = Math.min(h.vy + 0.22, 6.4);
      h.y += h.vy;
      const gy = Math.floor((h.y + h.h) / T);
      const gx = Math.floor((h.x + h.w / 2) / T);
      const bel = tileAt(l, gx, gy);
      if (SOLID.has(bel) || bel === '=') { h.y = gy * T - h.h; h.vy = 0; }
    }
    if (h.t >= 5 * 60) BOSS.hazards.splice(i, 1);
  }
  // 碰撞
  const pb = { x: player.x, y: player.y, w: player.w, h: player.h };
  for (const h of BOSS.hazards) {
    if (overlaps(pb, { x: h.x + 2, y: h.y + 2, w: h.w - 4, h: h.h - 4 })) { die('boss'); return; }
  }
  if (BOSS.t >= BOSS_SURVIVE && !BOSS.win) {
    BOSS.win = true; BOSS.active = false;
    BOSS.hazards.length = 0;
    GAME.banner = { text: 'BOSS 倒下了！快去终点', t: 160 };
    SFX.win();
  }
}

function update() {
  clock++;
  updateParticles();
  if (GAME.paused) return;
  if (GAME.banner && --GAME.banner.t <= 0) GAME.banner = null;

  if (GAME.state === 'play') {
    const l = GAME.level;
    GAME.time++;
    updatePlayer(l);
    updateMovers(l);
    updateEnemies(l);
    // 第 4 关（index 3）跑到 3/4 处触发 BOSS
    if (GAME.levelIndex === 3 && !BOSS.active && !BOSS.win && player.x > l.w * T * 0.75) bossStart();
    updateBoss(l);
    checkWorld(l);
    const tx = clamp(player.x - W / 2 + player.w / 2, 0, l.w * T - W);
    const ty = camTarget();
    cam.x += (tx - cam.x) * 0.18;
    cam.y += (ty - cam.y) * 0.12;
  } else if (GAME.state === 'dead') {
    GAME.timer++;
    if (GAME.timer > 70) respawn();
  } else if (GAME.state === 'clear') {
    GAME.timer++;
    if (GAME.timer > 200) nextLevel();
  } else if (GAME.state === 'over' || GAME.state === 'win') {
    GAME.timer++;
  }
}

/* ---------------- 渲染 ---------------- */
function blockyCircle(cx, cy, r, color) {
  ctx.fillStyle = color;
  for (let dy = -r; dy <= r; dy++) {
    const dx = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)));
    ctx.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1);
  }
}
function drawBackground(themeName) {
  const P = THEMES[themeName];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, P.sky[0]); g.addColorStop(1, P.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (P.stars) {
    for (const s of stars) {
      const tw = 0.45 + 0.55 * Math.abs(Math.sin(clock * 0.03 + s.tw));
      ctx.globalAlpha = tw;
      ctx.fillStyle = '#dfe8ff';
      ctx.fillRect(((s.x - cam.x * 0.08) % 400 + 400) % 400 | 0, s.y | 0, 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  const sx = W * 0.74 - cam.x * 0.03, sy = themeName === 'night' ? 34 : 30;
  ctx.fillStyle = P.sunGlow; blockyCircle(sx, sy, 22, P.sunGlow);
  blockyCircle(sx, sy, 11, P.sun);

  drawHills(P.hillFar, 0.18, 96, 12, 0.6);
  for (const c of clouds) {
    c.x -= c.sp;
    if (c.x < -40) c.x = W + 40;
    const cx = c.x - cam.x * 0.08;
    ctx.fillStyle = themeName === 'night' ? 'rgba(120,140,200,.16)' : 'rgba(255,255,255,.55)';
    const s = c.s;
    ctx.fillRect(cx, c.y, Math.round(16 * s), Math.round(6 * s));
    ctx.fillRect(cx + 5 * s, c.y - 4 * s, Math.round(10 * s), Math.round(5 * s));
    ctx.fillRect(cx + 16 * s, c.y + 2 * s, Math.round(12 * s), Math.round(4 * s));
  }
  drawHills(P.hillNear, 0.42, 126, 16, 1.1);

  const fog = ctx.createLinearGradient(0, H * 0.45, 0, H);
  fog.addColorStop(0, 'rgba(0,0,0,0)');
  fog.addColorStop(1, themeName === 'night' ? 'rgba(4,6,20,.55)' : 'rgba(20,10,30,.22)');
  ctx.fillStyle = fog; ctx.fillRect(0, H * 0.45, W, H * 0.55);
}
function drawHills(color, par, baseY, amp, freq) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let sx = 0; sx <= W; sx += 4) {
    const wx = (sx + cam.x * par) / 90;
    const y = baseY + Math.sin(wx * freq) * amp + Math.sin(wx * freq * 2.3 + 1.7) * amp * 0.35;
    ctx.lineTo(sx, y);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

function drawTiles(l) {
  const atlas = getAtlas(l.theme);
  const P = THEMES[l.theme];
  const tx0 = Math.max(0, Math.floor(cam.x / T)), tx1 = Math.min(l.w - 1, Math.floor((cam.x + W) / T));
  const ty0 = Math.max(0, Math.floor(cam.y / T)), ty1 = Math.min(l.h - 1, Math.floor((cam.y + H) / T));
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const ch = l.grid[ty][tx];
      if (ch === '.') continue;
      const sx = tx * T - cam.x, sy = ty * T - cam.y;
      let idx = -1;
      if (ch === '#') idx = AT_IDX.ground0 + (Math.floor(hash2(tx, ty) * 4) % 4);
      else if (ch === '=') idx = AT_IDX.plat;
      else if (ch === 'B') idx = AT_IDX.brick;
      else if (ch === '?') idx = AT_IDX.q;
      else if (ch === 'u') idx = AT_IDX.used;
      else if (ch === '^') idx = AT_IDX.spike;
      else if (ch === 'd') idx = hash2(tx, ty) > 0.4 ? AT_IDX.bush : AT_IDX.flower;
      else if (ch === 'X') idx = AT_IDX.crate;
      else if (ch === 'G') idx = AT_IDX.pole;
      if (idx >= 0) ctx.drawImage(atlas, idx * T, 0, T, T, Math.round(sx), Math.round(sy), T, T);
      // 斜坡：按坡面三角形填色（上坡亮一点，方便看清坡度）
      if (ch === '/' || ch === '\\') {
        ctx.fillStyle = P.hill2 || '#4a9e68';
        ctx.beginPath();
        const x0p = Math.round(sx), y1p = Math.round(sy + T);
        if (ch === '/') { ctx.moveTo(x0p, y1p); ctx.lineTo(x0p + T, y1p); ctx.lineTo(x0p + T, y1p - T); }
        else { ctx.moveTo(x0p, y1p); ctx.lineTo(x0p + T, y1p); ctx.lineTo(x0p, y1p - T); }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#6fd153';
        if (ch === '/') { for (let i = 0; i < T; i++) ctx.fillRect(Math.round(sx) + i, Math.round(sy + T - 1 - i), 1, 2); }
        else { for (let i = 0; i < T; i++) ctx.fillRect(Math.round(sx) + i, Math.round(sy + T - 1 - (T - 1 - i)), 1, 2); }
      }
    }
  }
  if (l.flag) {
    const fx = l.flag.x - cam.x, fy = l.flag.y - cam.y;
    const wave = Math.sin(clock * 0.18) * 1.5;
    ctx.fillStyle = P.accent;
    for (let i = 0; i < 7; i++) {
      const w = Math.max(1, 8 - i);
      ctx.fillRect(Math.round(fx + 1 + i + wave * (i / 7)), Math.round(fy - 7 + i), w, 1);
    }
    ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(fx + 8 + wave), Math.round(fy - 1), 2, 2);
  }
}

/** 复活点：一面小旗，碰到后死亡从此处重生。未激活为灰色并带“!”提示。 */
function drawCheckpoint(l) {
  if (!l.cp) return;
  const x = Math.round(l.cp.x - cam.x), y = Math.round(l.cp.y - cam.y);
  const on = l.cp.active;
  const wave = Math.sin(clock * 0.2) * 1.2;
  ctx.fillStyle = on ? '#d8dcea' : '#6b7191';
  ctx.fillRect(x + 7, y - 8, 2, 24);            // 杆
  ctx.fillStyle = on ? '#8b93b8' : '#4a5075';
  ctx.fillRect(x + 5, y + 15, 6, 4);            // 底座
  ctx.fillStyle = on ? '#7ed957' : '#8b93b8';   // 旗面
  const fy = y - 8;
  for (let i = 0; i < 6; i++) {
    ctx.fillRect(Math.round(x + 9 + i + wave * (i / 6)), fy + i, 8 - i, 1);
  }
  if (on) {
    ctx.fillStyle = '#c9f7d5';
    ctx.fillRect(Math.round(x + 9 + wave), fy, 4, 1);
  } else if (Math.floor(clock / 20) % 2 === 0) {
    drawText('!', x + 5, y - 18, '#ffd85e', 1, '#000');
  }
}

function drawCoins(l) {
  for (const c of l.coins) {
    if (c.taken) continue;
    const x = c.x * T - cam.x + 8, y = c.y * T - cam.y + 8 + Math.sin(clock * 0.09 + c.ph) * 1.5;
    const f = Math.floor(clock * 0.11 + c.ph) % 4;
    const w = [7, 5, 2, 5][f];
    ctx.fillStyle = '#8a5c0d';
    ctx.fillRect(Math.round(x - w / 2 - 1), Math.round(y - 6), w + 2, 12);
    ctx.fillStyle = '#ffd85e';
    ctx.fillRect(Math.round(x - w / 2), Math.round(y - 5), w, 10);
    ctx.fillStyle = '#fff3b0';
    ctx.fillRect(Math.round(x - w / 2), Math.round(y - 5), 1, 10);
    ctx.fillStyle = '#8a5c0d';
    ctx.fillRect(Math.round(x - w / 2), Math.round(y - 5), w, 1);
  }
}

function drawMovers(l) {
  const P = THEMES[l.theme];
  for (const m of l.movers) {
    const x = m.x - cam.x, y = m.y - cam.y;
    ctx.fillStyle = P.block[3]; ctx.fillRect(Math.round(x) - 1, Math.round(y), m.w + 2, m.h + 2);
    ctx.fillStyle = P.plat[0]; ctx.fillRect(Math.round(x), Math.round(y) + 1, m.w, m.h);
    ctx.fillStyle = lighten(P.plat[0], .3); ctx.fillRect(Math.round(x), Math.round(y) + 1, m.w, 2);
    ctx.fillStyle = P.accent;
    for (let i = 4; i < m.w - 2; i += 10) ctx.fillRect(Math.round(x) + i, Math.round(y) + 3, 2, 2);
  }
  // 地雷：埋伏型只露一点点凸起；移动型画成看得见的圆盘雷 + 闪烁指示灯
  for (const mn of l.mines || []) {
    if (!mn.armed) continue;
    const mx = Math.round(mn.x - cam.x), my = Math.round(mn.y - cam.y);
    const hot = mn.blink < 30;                       // 指示灯闪烁
    if (mn.buried) {
      ctx.fillStyle = 'rgba(70,55,45,.9)';           // 埋着的：只有小凸起 + 一点反光
      ctx.fillRect(mx + 2, my, 9, 4);
      ctx.fillStyle = hot ? '#ff5a5a' : '#7a2a2a';
      ctx.fillRect(mx + 6, my + 1, 2, 2);
    } else {
      ctx.fillStyle = '#2f3346';                     // 盘体
      ctx.fillRect(mx, my + 2, 14, 6);
      ctx.fillStyle = '#575e7a';
      ctx.fillRect(mx + 1, my + 1, 12, 3);
      ctx.fillStyle = hot ? '#ff6b6b' : '#8a2a2a';   // 闪烁指示灯（看得见的预警）
      ctx.fillRect(mx + 5, my - 1, 4, 3);
      ctx.fillStyle = '#ffd85e';
      ctx.fillRect(mx + 6, my, 2, 1);
    }
  }
  // 爆炸特效
  for (const bm of l.boom || []) {
    const bx = Math.round(bm.x - cam.x), by = Math.round(bm.y - cam.y);
    const r = 4 + bm.t * 1.1;
    ctx.fillStyle = bm.t < 12 ? '#fff2a0' : '#ff8a3a';
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,90,40,.5)';
    ctx.beginPath(); ctx.arc(bx, by, r * 1.6, 0, Math.PI * 2); ctx.fill();
  }
  // 地刺埋伏：从地面升起的尖刺（up 控制升起高度，藏在地下时只画一条土缝提示）
  for (const bp of l.buried || []) {
    const bx = Math.round(bp.x - cam.x), by = Math.round(bp.y + T - cam.y);
    if (bp.up <= 0.02) {
      // 藏在地下：留一条细缝；预警期抖动并变红，给出反应时间
      const warn = bp.phase === 'warn';
      const jit = warn ? Math.round(Math.sin(clock * 0.9) * 1.5) : 0;
      ctx.fillStyle = warn ? '#d94a4a' : 'rgba(120,90,60,.55)';
      ctx.fillRect(bx + 1 + jit, by - 1, 14, warn ? 2 : 1);
      continue;
    }
    const h = Math.round(bp.up * 14);
    ctx.fillStyle = '#3a3f5a';
    ctx.fillRect(bx, by - 3, 16, 3);
    ctx.fillStyle = '#e8e8f0';
    for (let i = 0; i < 16; i += 4) {
      ctx.fillRect(bx + i, by - 3, 2, 1);
      ctx.fillRect(bx + i + 1, by - 3 - Math.round(h * 0.55), 1, Math.round(h * 0.55));
      ctx.fillRect(bx + i + 1, by - 3 - h, 1, Math.round(h * 0.45));
    }
  }
  // 横扫尖刺：底座 + 一排尖齿，来回平移
  for (const sm of l.spikeMovers || []) {
    const x = Math.round(sm.x - cam.x), y = Math.round(sm.y - cam.y);
    ctx.fillStyle = '#3a3f5a';
    ctx.fillRect(x, y + 5, sm.w, 3);
    ctx.fillStyle = '#e8e8f0';
    for (let i = 0; i < sm.w; i += 4) {
      ctx.fillRect(x + i, y + 5, 2, 1);
      ctx.fillRect(x + i + 1, y + 2, 1, 3);
      ctx.fillRect(x + i + 1, y, 1, 2);
    }
  }
}

/** BOSS 本体（天空中的大蘑菇）与它放出的技能物件。 */
function drawBoss(l) {
  if (!BOSS.active && !BOSS.win) return;
  // boss 本体：屏幕上方中央的大蘑菇（打不死，只能躲）
  const bx = Math.round(W / 2 - 16), by = 14;
  const pal = { B: '#a55ad0', W: '#ffe27a', K: '#3a1f52', S: '#e8b0f0' };
  for (let i = 0; i < 2; i++) drawSprite(SHROOM, pal, bx + (i ? 16 : 0), by, false, 1);   // 两个拼成大的
  // 技能物件
  for (const h of BOSS.hazards) {
    const x = Math.round(h.x - cam.x), y = Math.round(h.y - cam.y);
    const blink = h.t > 5 * 60 - 60 && Math.floor(h.t / 5) % 2 === 0;    // 快消失时闪烁提示
    if (blink) continue;
    if (h.kind === 'mine') {
      ctx.fillStyle = '#2f3346'; ctx.fillRect(x, y + 2, 12, 6);
      ctx.fillStyle = '#d94a4a'; ctx.fillRect(x + 4, y - 1, 4, 3);
    } else {
      const p = h.kind === 'purple' ? { B: '#8a6de0', W: '#ffe27a', K: '#3a2b52', S: '#c9b3ff' }
                                    : { B: '#e05a5a', W: '#fff4e0', K: '#5a1424', S: '#f0e2c8' };
      drawSprite(SHROOM, p, x, y, false, 1);
    }
  }
}

function drawEnemies(l) {
  for (const e of l.enemies) {
    if (e.dead < 0) continue;
    if (e.dead > 0) { ctx.globalAlpha = Math.max(0, 1 - e.dead / 20); }
    const x = e.x - cam.x, y = e.y - cam.y;
    if (e.type === 0) {
      // 受伤状态（还剩 1 血）画成暗红+裂纹，方便玩家看出「再踩一下就死」
      const hurt = e.hp !== undefined && e.hp <= 1;
      const flash = e.hitFlash > 0 && Math.floor(e.hitFlash / 3) % 2 === 0;
      const pal = hurt ? { B: '#a03a52', W: '#ffd0c0', K: '#3a0c18', S: '#d8c8a8' }
                       : { B: '#e05a5a', W: '#fff4e0', K: '#5a1424', S: '#f0e2c8' };
      const wob = e.dead ? 1 : (Math.sin(clock * 0.25 + e.ph) > 0 ? 1 : 0);
      drawSprite(SHROOM, pal, Math.round(x), Math.round(y), false, 1);
      if (hurt) {   // 裂纹画在菌盖上，一眼看出「再踩一下就死」
        ctx.fillStyle = '#3a0c18';
        ctx.fillRect(Math.round(x) + 6, Math.round(y) + 2, 1, 4);
        ctx.fillRect(Math.round(x) + 7, Math.round(y) + 6, 1, 2);
        ctx.fillRect(Math.round(x) + 5, Math.round(y) + 8, 1, 2);
      }
      if (flash) {  // 受击闪白
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.fillRect(Math.round(x), Math.round(y), 14, 16);
      }
      if (wob) { ctx.fillStyle = '#7a1f1f'; ctx.fillRect(Math.round(x) + 2, Math.round(y) + 11, 2, 1); }
    } else if (e.faller) {
      // 天空偷袭怪：没松爪时微微晃着挂在上面，俯冲下来后正常画
      const pal = { B: '#c85ad0', W: '#ffe27a', K: '#4a1f52', S: '#e8b0f0' };
      const sway = e.armed ? Math.sin(clock * 0.12 + e.ph) * 1.5
        : (e.windup > 0 ? Math.sin(clock * 0.9) * 2.5 : 0);   // 蓄力时剧烈抖动，是明确的预警
      drawSprite(SHROOM, pal, Math.round(x + sway), Math.round(y), false, 1);
      if (e.armed) { ctx.fillStyle = 'rgba(255,180,255,.45)'; ctx.fillRect(Math.round(x + 6), Math.round(y) + 16, 1, 6); }
    } else {
      const pal = { B: '#8a6de0', W: '#ffe27a', WW: '#3a2b52' };
      drawSprite(FLY, pal, Math.round(x), Math.round(y), e.dir > 0, 1);
    }
    ctx.globalAlpha = 1;
  }
}

function drawPlayer() {
  if (player.inv > 0 && Math.floor(player.inv / 4) % 2 === 0) return;
  let name;
  if (!player.onGround) name = player.vy < 0 ? 'jump' : 'fall';
  else if (Math.abs(player.vx) > 0.35) name = (Math.floor(player.anim / 6) % 2) ? 'run1' : 'run2';
  else name = 'idle';
  const x = Math.round(player.x - 1 - cam.x), y = Math.round(player.y - 2 - cam.y);
  if (player.spin > 0) {
    // 旋转跳：把主角按当前角度转着画出来，一眼能看出在转
    const ang = (34 - player.spin) / 34 * Math.PI * 2;
    ctx.save();
    ctx.translate(x + 6, y + 7);
    ctx.rotate(ang);
    ctx.translate(-6, -7);
    drawSprite(HERO[name === 'idle' ? 'jump' : name], HERO_PAL, 0, 0, player.facing < 0, 1);
    ctx.restore();
    return;
  }
  drawSprite(HERO[name], HERO_PAL, x, y, player.facing < 0, 1);
}

function drawHUD() {
  const l = GAME.level;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(0, 0, W, 13);
  for (let i = 0; i < Math.max(0, GAME.lives); i++) {
    const x = 5 + i * 9, y = 4;
    ctx.fillStyle = '#e8484f'; ctx.fillRect(x + 1, y, 5, 1); ctx.fillRect(x, y + 1, 7, 3);
    ctx.fillStyle = '#ff8a8a'; ctx.fillRect(x + 1, y + 1, 2, 1);
    ctx.fillRect(x + 2, y + 4, 3, 1); ctx.fillRect(x + 3, y + 5, 1, 1);
  }
  drawText('x' + String(GAME.coins).padStart(2, '0'), 5 + Math.max(0, GAME.lives) * 9 + 4, 4, '#ffd85e', 1, '#000');
  const t = GAME.time;
  const timeStr = Math.floor(t / 3600) + ':' + String(Math.floor(t / 60) % 60).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  drawText(timeStr, W - textWidth(timeStr, 1) - 5, 4, '#cfe0ff', 1, '#000');
  centerText(GAME.levelIndex + 1 + '/' + LEVELS.length + '  ' + l.name, 16, '#ffffff', 1, '#000');
  // BOSS 关：显示倒计时（剩多少秒撑过去）+ 血条样式的进度
  if (BOSS.active || BOSS.win) {
    const left = Math.max(0, Math.ceil((BOSS_SURVIVE - BOSS.t) / 60));
    const label = BOSS.win ? 'BOSS DEFEATED' : 'BOSS ' + left + 's';
    const cx = Math.round(W / 2 - textWidth(label, 1) / 2);
    drawText(label, cx, 36, BOSS.win ? '#7ed957' : '#ff8a6b', 1, '#000');
    // 进度条：撑过 100 秒的比例
    const pw = 90, ph = 4, px0 = Math.round(W / 2 - pw / 2), py0 = 44;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(px0, py0, pw, ph);
    ctx.fillStyle = BOSS.win ? '#7ed957' : '#ff8a6b';
    ctx.fillRect(px0, py0, Math.round(pw * Math.min(1, BOSS.t / BOSS_SURVIVE)), ph);
  }
  if (GAME.banner) {                     // 顶部横幅，如 CHECKPOINT!
    ctx.globalAlpha = Math.min(1, GAME.banner.t / 25);
    centerText(GAME.banner.text, 26, '#7ed957', 1, '#000');
    ctx.globalAlpha = 1;
  }
}

function overlay(alpha) { ctx.fillStyle = 'rgba(4,6,16,' + alpha + ')'; ctx.fillRect(0, 0, W, H); }

/** 闪烁的操作提示：触屏显示点按文案，键鼠显示回车。 */
function pressPrompt(tapText, y) {
  if (Math.floor(clock / 30) % 2 === 0) centerText(IS_TOUCH ? tapText : 'PRESS ENTER', y, '#ffffff', 1, '#000');
}

/** 选关界面：6 列网格，已解锁的关卡可选中进入。 */
function drawSelect() {
  overlay(.82);
  centerText('SELECT LEVEL', 16, '#ffd85e', 2, '#000');
  centerText('UNLOCKED ' + SAVE.unlocked + '/' + LEVELS.length, 34, '#cfe0ff', 1, '#000');
  const cols = 6, cw = 34, ch = 22, x0 = (W - cols * cw) / 2 + 4, y0 = 50;
  for (let i = 0; i < LEVELS.length; i++) {
    const cx = Math.round(x0 + (i % cols) * cw), cy = y0 + Math.floor(i / cols) * ch;
    const locked = i >= SAVE.unlocked;
    const sel = i === selectIdx;
    ctx.fillStyle = locked ? '#2a2f4a' : (sel ? '#3f6ee0' : '#2f3a6b');
    ctx.fillRect(cx - 12, cy - 7, 26, 16);
    ctx.strokeStyle = sel ? '#ffd85e' : '#4a5590';
    ctx.lineWidth = 1;
    ctx.strokeRect(cx - 12.5, cy - 7.5, 27, 17);
    drawText(locked ? '--' : String(i + 1), cx - 5, cy - 3, locked ? '#5a6080' : '#ffffff', 1);
    if (!locked && SAVE.best[i]) drawText(SAVE.best[i].time + 'S', cx - 11, cy + 12, '#7dff9b', 1);
  }
  const name = LEVELS[selectIdx] ? LEVELS[selectIdx].name : '';
  centerText((selectIdx + 1) + '. ' + name, 150, '#ffffff', 1, '#000');
  if (Math.floor(clock / 30) % 2 === 0) {
    centerText(IS_TOUCH ? 'TAP TO PLAY' : 'ENTER PLAY   ·   ESC BACK', 166, '#7dff9b', 1, '#000');
  }
}

function drawState() {
  if (GAME.state === 'title') {
    overlay(.55);
    const bob = Math.sin(clock * 0.05) * 2;
    centerText('PIXEL', 22 + bob, '#ffd85e', 3, '#000');
    centerText('RUNNER', 48 - bob, '#7ed957', 3, '#000');
    drawSprite(HERO.idle, HERO_PAL, W / 2 - 6, 74 + Math.sin(clock * 0.06) * 2, false, 1);
    // 存档进度：未通关时显示「继续 第 N 关」，已解锁的关卡数
    const unlocked = SAVE.unlocked, total = LEVELS.length;
    centerText('PROGRESS ' + unlocked + '/' + total, 100, '#cfe0ff', 1, '#000');
    if (unlocked > 1) {
      const b = SAVE.best[SAVE.last - 1];
      centerText('BEST ' + (b ? b.time + 'S' : '--') + '   COINS ' + SAVE.coins, 110, '#8a90b8', 1, '#000');
    }
    if (Math.floor(clock / 30) % 2 === 0) {
      centerText(IS_TOUCH ? 'TAP TO CONTINUE' : 'ENTER  CONTINUE', 132, '#ffffff', 1, '#000');
    }
    centerText(IS_TOUCH ? 'TAP HERE FOR LEVELS' : 'S  LEVEL SELECT   ·   R  RESET', 148, '#7dff9b', 1, '#000');
    return;
  }
  if (GAME.state === 'select') { drawSelect(); return; }
  if (GAME.state === 'dead') {
    overlay(Math.min(.6, GAME.timer / 110));
    centerText('OUCH!', 74, '#ff6b6b', 2, '#000');
    centerText('LIVES ' + Math.max(0, GAME.lives - 1), 98, '#ffffff', 1, '#000');
    return;
  }
  if (GAME.state === 'clear') {
    overlay(Math.min(.55, GAME.timer / 60));
    centerText('STAGE CLEAR', 56, '#7ed957', 2, '#000');
    centerText('COINS ' + GAME.coins, 82, '#ffd85e', 1, '#000');
    centerText('TIME ' + (GAME.time / 60).toFixed(1) + 'S', 92, '#cfe0ff', 1, '#000');
    if (GAME.levelIndex + 1 < LEVELS.length && GAME.timer > 30) {
      pressPrompt('TAP TO CONTINUE', 122);
    } else {
      centerText('LAST STAGE!', 122, '#ffffff', 1, '#000');
    }
    return;
  }
  if (GAME.state === 'over') {
    overlay(.68);
    centerText('GAME OVER', 62, '#ff6b6b', 2, '#000');
    centerText('COINS ' + GAME.totalCoins, 90, '#ffd85e', 1, '#000');
    centerText('REACHED ' + (GAME.levelIndex + 1) + '/' + LEVELS.length, 100, '#cfe0ff', 1, '#000');
    pressPrompt('TAP TO RETRY', 130);
    return;
  }
  if (GAME.state === 'win') {
    overlay(.6);
    const rank = (GAME.totalTime + GAME.deaths * 20 < 150 && GAME.totalCoins > 60) ? 'S' : (GAME.deaths < 6 ? 'A' : 'B');
    centerText('YOU WIN!', 44, '#7ed957', 2, '#000');
    centerText('RANK ' + rank, 74, '#ffd85e', 2, '#000');
    centerText('TIME ' + (GAME.totalTime / 60).toFixed(1) + 'S', 102, '#cfe0ff', 1, '#000');
    centerText('COINS ' + GAME.totalCoins + '   DEATHS ' + GAME.deaths, 112, '#cfe0ff', 1, '#000');
    pressPrompt('TAP TO PLAY AGAIN', 140);
    return;
  }
  if (GAME.paused && GAME.state === 'play') {
    overlay(.6);
    centerText('PAUSED', 76, '#ffffff', 2, '#000');
    centerText(IS_TOUCH ? 'TAP START TO RESUME' : 'PRESS P TO RESUME', 106, '#cfe0ff', 1, '#000');
  }
}

function render() {
  if (GAME.state === 'title') {
    drawBackground('meadow');
    drawDemoFloor();
  } else {
    const l = GAME.level;
    drawBackground(l.theme);
    drawTiles(l);
    drawCheckpoint(l);
    drawCoins(l);
    drawMovers(l);
    drawBoss(l);
    drawEnemies(l);
    drawPlayer();
    drawParticles();
    drawHUD();
  }
  drawState();
  if (GAME.crt) {
    ctx.fillStyle = 'rgba(0,0,0,.10)';
    for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
    ctx.fillStyle = 'rgba(0,0,0,.20)';
    ctx.fillRect(0, 0, W, 1); ctx.fillRect(0, H - 1, W, 1);
    ctx.fillRect(0, 0, 1, H); ctx.fillRect(W - 1, 0, 1, H);
  }
}
function drawDemoFloor() {
  const atlas = getAtlas('meadow');
  for (let x = -Math.floor(clock * 0.4 / T); x < W / T + 2; x++) {
    const tx = x + Math.floor(clock * 0.4 / T);
    ctx.drawImage(atlas, (AT_IDX.ground0 + (Math.floor(hash2(tx, 7) * 4) % 4)) * T, 0, T, T, x * T, H - T, T, T);
    ctx.drawImage(atlas, (AT_IDX.ground0 + (Math.floor(hash2(tx, 8) * 4) % 4)) * T, 0, T, T, x * T, H, T, T);
  }
  for (let i = 0; i < 6; i++) {
    const x = ((i * 61 + 12) % (W + 40)) - 20 - (clock * 0.12 % 40);
    ctx.drawImage(atlas, (i % 3 ? AT_IDX.bush : AT_IDX.flower) * T, 0, T, T, x, H - T - (i % 3 ? 0 : T), T, T);
  }
}

/* ---------------- 自适应缩放 ---------------- */
function resize() {
  // 触屏：底部有虚拟按键条，上方提示条换行；给它们留位，画面尽量占满宽度
  const chromeH = IS_TOUCH ? 176 : 84;
  const pad = 8;
  const availW = innerWidth - (IS_TOUCH ? 8 : 24), availH = innerHeight - chromeH - pad;
  // 等比放大铺满可用宽度（高度放不下时按高度回退），触屏/非触屏同规则，不再取 0.5 整倍
  let s = Math.min(availW / W, availH / H);
  s = Math.max(IS_TOUCH ? 0.4 : 0.5, Math.min(s, IS_TOUCH ? 4 : 6));
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
}
addEventListener('resize', resize);
resize();

/* ---------------- 主循环 ---------------- */
loadSave();                                   // 读取本机存档（解锁进度 / 最佳成绩）
loadLevel(Math.max(0, SAVE.last - 1));        // 标题背景用上次玩到的关卡
GAME.state = 'title';
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.25, (now - last) / 1000);
  last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* 调试钩子：便于自动试玩与验证 */
window.PR = { GAME, player, LEVELS, loadLevel, keys };
</script>
